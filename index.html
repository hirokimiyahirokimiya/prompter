<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学会プロンプター</title>
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="プロンプター">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one slide's script per screen. Top: counter / timer / settings. Middle: horizontal track of slides (swipe). Bottom: next-slide preview + two large buttons in thumb reach. Dark only, for a dim hall. */
:root{
  --bg:#0e1116; --panel:#161b22; --raised:#1d242d; --line:#2a323d;
  --fg:#f1f4f8; --dim:#7b8794; --faint:#4a5461;
  --accent:#ffc94a; --accent-ink:#1a1400;
  --warn:#ff9a4a; --bad:#ff5a5f;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --fs:30px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));position:relative}
.count{background:none;border:0;padding:4px 0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.count small{font-size:13px;color:var(--dim);font-weight:400}
.count .chev{font-size:11px;color:var(--dim);margin-left:2px}
.timer{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.4em;text-align:center}
.timer.paused{color:var(--dim)}
.timer.warn{color:var(--warn);border-color:var(--warn)}
.timer.over{color:var(--bad);border-color:var(--bad)}
.gear{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:14px}
.bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);transition:width .3s ease;width:0}

/* slide track */
.viewport{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.track{height:100%;display:flex;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;position:relative;
  padding:22px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.slide .no{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.slide .no::after{content:"";flex:1;height:1px;background:var(--line)}
.slide .txt{font-size:var(--fs);line-height:1.7;font-weight:700;white-space:pre-wrap;word-break:break-word;margin:0;max-width:40em}
.more{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--bg));display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:12px;color:var(--dim)}
.edge{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;color:var(--faint);pointer-events:none}

/* bottom */
.next{padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel);
  font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{color:var(--accent);font-weight:700;margin-right:6px}
.ctrl{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;background:var(--panel);
  padding:4px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.ctrl button{border-radius:16px;padding:20px 0;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--raised)}
.ctrl .fwd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctrl button:disabled{opacity:.3}
.ctrl button:active:not(:disabled){transform:scale(.97)}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:12px;overflow-y:auto;-webkit-user-select:text;user-select:text;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet h2{margin:0;font-size:19px;margin-right:auto}
.x{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
.sheet textarea{flex:1;min-height:42vh;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;line-height:1.7;resize:vertical}
.found{font-size:14px;color:var(--accent);font-weight:700}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.row label{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
.row input[type=number]{width:4.5em;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.row input[type=range]{width:10em;accent-color:var(--accent)}
.note{font-size:13px;color:var(--dim);line-height:1.7;margin:0}
.note code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--fg);font-family:inherit}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:14px}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list button{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.list button.on{border-color:var(--accent)}
.list .n{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;min-width:2em}
.list .t{color:var(--fg);font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.track,.bar{transition:none}}
@media (min-width:700px){.ctrl{grid-template-columns:1fr 1.6fr;max-width:640px;margin:0 auto;width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="count" class="count" type="button" aria-label="スライド一覧を開く"><span id="cur">1</span><small>/ <span id="tot">1</span></small><span class="chev">▼</span></button>
    <button id="timer" class="timer paused" type="button" aria-label="タイマーの開始と一時停止">7:00</button>
    <button id="openSet" class="gear" type="button">原稿・設定</button>
    <div id="bar" class="bar"></div>
  </header>

  <main id="viewport" class="viewport">
    <div id="track" class="track"></div>
  </main>

  <div id="next" class="next"></div>
  <nav class="ctrl">
    <button id="prev" type="button">‹ 前へ</button>
    <button id="fwd" class="fwd" type="button">次へ ›</button>
  </nav>
</div>

<section id="setSheet" class="sheet" hidden>
  <div class="sheet-head">
    <h2>原稿と設定</h2>
    <button id="closeSet" class="x" type="button">閉じる</button>
  </div>
  <textarea id="src" spellcheck="false" aria-label="読み原稿"></textarea>
  <div id="found" class="found"></div>
  <p class="note">スライドの区切りは、<code>（クリック）</code> だけの行、または <code>---</code> だけの行です。区切りの行がない原稿は、空行（何も書いていない行）で区切ります。原稿はこのスマホの中にだけ保存されます。</p>
  <div class="row">
    <label>持ち時間 <input id="mins" type="number" min="1" max="90" value="7" inputmode="numeric"> 分</label>
    <label>文字の大きさ <input id="fs" type="range" min="20" max="56" value="30"></label>
  </div>
  <div class="btns">
    <button id="resetAll" class="ghost" type="button">1枚目とタイマーを戻す</button>
    <button id="apply" class="primary" type="button">この原稿で使う</button>
  </div>
</section>

<section id="listSheet" class="sheet" hidden>
  <div class="sheet-head">
    <h2>スライドへ移動</h2>
    <button id="closeList" class="x" type="button">閉じる</button>
  </div>
  <ol id="list" class="list"></ol>
</section>

<div id="toast" class="toast" hidden></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('prompter:' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('prompter:' + k, v); } catch {} }
};

const SAMPLE = `【サンプル原稿】本日は、乳房再建における脂肪注入の生着率向上について、当院での取り組みをご報告いたします。
（クリック）
対象は2023年から2025年に脂肪注入を行った128例です。平均年齢は46歳、観察期間の中央値は14か月でした。
（クリック）
脂肪の採取にはコールマン法を用い、遠心分離の条件を三つの群に分けて比較しました。
（クリック）
結果として、低速の遠心分離群では生着率が平均68パーセントと、ほかの群に比べて有意に高い値を示しました。
（クリック）
以上より、採取から注入までの処理を丁寧に行うことが、生着率の向上に直結すると考えられます。ご清聴ありがとうございました。`;

// ---------- split script into slides ----------
const SEP = /^\s*(?:[（(【\[]\s*(?:クリック|くりっく|click|次へ|次のスライド|スライド\s*\d*|slide\s*\d*)\s*[）)】\]]|-{3,}|ー{3,}|={3,}|＝{3,})\s*$/i;
function split(text){
  const lines = text.replace(/\r/g, '').split('\n');
  let parts;
  if (lines.some(l => SEP.test(l))){
    parts = []; let buf = [];
    for (const l of lines){ if (SEP.test(l)){ parts.push(buf.join('\n')); buf = []; } else buf.push(l); }
    parts.push(buf.join('\n'));
  } else {
    parts = text.replace(/\r/g, '').split(/\n\s*\n/);
  }
  return parts.map(p => p.trim()).filter(Boolean);
}

// ---------- state ----------
let text = store.get('text', SAMPLE);
let slides = split(text);
let idx = Math.min(+store.get('idx', 0) || 0, Math.max(0, slides.length - 1));

const track = $('track'), viewport = $('viewport');
function esc(t){ return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function build(){
  track.innerHTML = slides.map((s, i) =>
    `<section class="slide" aria-label="スライド${i+1}"><p class="no">SLIDE ${i+1}</p><p class="txt">${esc(s)}</p><div class="more" hidden>続きあり ↓</div></section>`
  ).join('');
  track.querySelectorAll('.slide').forEach(el => el.addEventListener('scroll', () => checkMore(el), {passive:true}));
  $('tot').textContent = slides.length;
  show(false);
}
function checkMore(el){
  const more = el.querySelector('.more');
  more.hidden = el.scrollHeight - el.scrollTop - el.clientHeight < 8;
  more.style.bottom = (-el.scrollTop) + 'px';
}
function offset(dx){ track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`; }
function show(animate = true){
  track.classList.toggle('drag', !animate);
  offset(0);
  $('cur').textContent = idx + 1;
  $('bar').style.width = ((idx + 1) / slides.length * 100) + '%';
  $('prev').disabled = idx === 0;
  $('fwd').disabled = idx >= slides.length - 1;
  const nx = slides[idx + 1];
  $('next').innerHTML = nx ? '<b>次</b>' + esc(nx.replace(/\s+/g, ' ').slice(0, 60)) : '<b>最後</b>このスライドで終わりです';
  const el = track.children[idx];
  if (el){ el.scrollTop = 0; requestAnimationFrame(() => checkMore(el)); }
  store.set('idx', idx);
}
function go(i){
  const n = Math.max(0, Math.min(slides.length - 1, i));
  if (n === idx){ show(); return; }
  if (n > idx && !tStart && elapsed === 0) startTimer();   // the talk starts with the first page turn
  idx = n; show();
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}
$('fwd').onclick = () => go(idx + 1);
$('prev').onclick = () => go(idx - 1);

// ---------- swipe (finger follows, then settles) ----------
let sx = 0, sy = 0, st = 0, dx = 0, axis = null, pid = null;
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pid = e.pointerId; sx = e.clientX; sy = e.clientY; st = performance.now(); dx = 0; axis = null;
});
viewport.addEventListener('pointermove', e => {
  if (e.pointerId !== pid) return;
  const mx = e.clientX - sx, my = e.clientY - sy;
  if (!axis){
    if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
    axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (axis === 'x'){ track.classList.add('drag'); try { viewport.setPointerCapture(pid); } catch {} }
  }
  if (axis !== 'x') return;
  const atEdge = (mx > 0 && idx === 0) || (mx < 0 && idx === slides.length - 1);
  dx = atEdge ? mx / 3 : mx;
  offset(dx);
});
function endDrag(e){
  if (e.pointerId !== pid) return;
  pid = null;
  if (axis !== 'x') return;
  track.classList.remove('drag');
  const v = dx / Math.max(1, performance.now() - st);
  const w = viewport.clientWidth;
  if ((dx < -w * 0.18 || v < -0.45) && idx < slides.length - 1) go(idx + 1);
  else if ((dx > w * 0.18 || v > 0.45) && idx > 0) go(idx - 1);
  else show();
  axis = null; dx = 0;
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

// clicker / keyboard
document.addEventListener('keydown', e => {
  if (!$('setSheet').hidden || !$('listSheet').hidden) return;
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); go(idx + 1); }
  if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); go(idx - 1); }
});

// ---------- timer ----------
let limit = (+store.get('mins', 7) || 7) * 60, elapsed = 0, tStart = 0, tId = 0;
const tm = $('timer');
function fmt(sec){ const neg = sec < 0; sec = Math.abs(Math.round(sec)); return (neg ? '+' : '') + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function drawTimer(){
  const now = elapsed + (tStart ? (performance.now() - tStart) / 1000 : 0);
  const left = limit - now;
  tm.textContent = fmt(left);
  tm.className = 'timer' + (!tStart ? ' paused' : '') + (left < 0 ? ' over' : left < 60 ? ' warn' : '');
}
function startTimer(){ if (tStart) return; tStart = performance.now(); tId = setInterval(drawTimer, 250); drawTimer(); wake(true); }
function pauseTimer(){ if (!tStart) return; elapsed += (performance.now() - tStart) / 1000; tStart = 0; clearInterval(tId); drawTimer(); }
function resetTimer(){ pauseTimer(); elapsed = 0; drawTimer(); }
tm.onclick = () => tStart ? pauseTimer() : startTimer();

// keep the screen on
let lock = null;
async function wake(on){
  try {
    if (on && 'wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(true); });
document.addEventListener('pointerdown', () => wake(true), {once:true});

// ---------- settings ----------
const src = $('src'), fs = $('fs'), mins = $('mins');
function applyFont(){ document.documentElement.style.setProperty('--fs', fs.value + 'px'); }
function countFound(){ const n = split(src.value).length; $('found').textContent = n ? `${n}枚のスライドに分かれます` : '原稿を貼り付けてください'; }
$('openSet').onclick = () => { src.value = text; countFound(); $('setSheet').hidden = false; };
$('closeSet').onclick = () => { $('setSheet').hidden = true; };
src.oninput = countFound;
fs.oninput = applyFont;
$('apply').onclick = () => {
  const t = src.value.trim();
  if (!t){ toast('原稿が空です。貼り付けてから押してください。'); return; }
  const changed = t !== text;
  text = t; slides = split(text);
  store.set('text', text); store.set('fs', fs.value);
  const m = Math.max(1, Math.min(90, +mins.value || 7)); store.set('mins', m); limit = m * 60;
  if (changed) idx = 0;
  idx = Math.min(idx, slides.length - 1);
  $('setSheet').hidden = true; build(); drawTimer();
  toast(`${slides.length}枚のスライドで準備できました`);
};
$('resetAll').onclick = () => { idx = 0; resetTimer(); $('setSheet').hidden = true; show(false); toast('1枚目に戻しました'); };

// ---------- slide list ----------
$('count').onclick = () => {
  $('list').innerHTML = slides.map((s, i) =>
    `<li><button type="button" data-i="${i}" class="${i === idx ? 'on' : ''}"><span class="n">${i+1}</span><span class="t">${esc(s.replace(/\s+/g, ' '))}</span></button></li>`).join('');
  $('listSheet').hidden = false;
  const on = $('list').querySelector('.on'); if (on) on.scrollIntoView({block:'center'});
};
$('closeList').onclick = () => { $('listSheet').hidden = true; };
$('list').onclick = e => { const b = e.target.closest('button'); if (!b) return; $('listSheet').hidden = true; idx = +b.dataset.i; show(false); };

function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

// ---------- boot ----------
fs.value = store.get('fs', 30); mins.value = Math.round(limit / 60);
applyFont(); build(); drawTimer();
addEventListener('resize', () => show(false));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

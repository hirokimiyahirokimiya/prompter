<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1116">
<title>学会プロンプター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one-screen stage tool. Top bar (status/timer), scrolling script, thumb-reach control bar at bottom. Dark only, for a dim hall. */
:root{
  --bg:#0e1116; --panel:#161b22; --line:#2a323d;
  --fg:#e8edf3; --dim:#5d6876; --done:#3d4652;
  --accent:#ffc94a; --accent-ink:#1a1400;
  --ok:#4fd18b; --warn:#ff8a4a; --bad:#ff5a5f;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em;margin-right:auto}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.on{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--bad);border-color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;min-width:5.2em;text-align:right}
.timer.warn{color:var(--warn)} .timer.over{color:var(--bad)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}

/* prompter */
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.stage.mirror .script{transform:scaleX(-1)}
.script{padding:30vh 18px 70vh;font-size:var(--fs,28px);line-height:1.75;font-weight:700;max-width:46em;margin:0 auto;word-break:break-all}
.s{color:var(--fg);border-radius:6px;transition:color .25s}
.s.done{color:var(--accent)}
.s.cur{color:var(--fg)}
.s.cur .r{color:var(--accent)}
.s.cur .caret{display:inline-block;width:3px;height:1em;background:var(--accent);vertical-align:-.12em;margin:0 1px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.s.cur .caret{animation:none}.s{transition:none}}
.para{display:block;height:.9em}
.cue{display:block;width:fit-content;font-size:.5em;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:.1em .6em;margin:.5em 0;opacity:.55;letter-spacing:.05em}
.cue.past{opacity:.25}
.guide{position:fixed;left:0;right:0;top:calc(30vh + env(safe-area-inset-top,0px));height:0;border-top:1px dashed rgba(255,201,74,.18);pointer-events:none}

/* heard */
.heard{padding:6px 14px;font-size:13px;color:var(--dim);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.2em}
.heard b{color:var(--fg);font-weight:400}

/* bottom controls */
.ctrl{display:grid;grid-template-columns:1fr 1fr 2fr 1fr 1fr;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.ctrl button{border:1px solid var(--line);background:#1d242d;border-radius:12px;padding:14px 0;font-size:15px}
.ctrl .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:17px}
.ctrl .go.stop{background:var(--bad);border-color:var(--bad);color:#fff}

/* editor sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;overflow-y:auto}
.sheet h2{margin:0;font-size:18px}
.sheet textarea{flex:1;min-height:40vh;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;line-height:1.7;resize:vertical}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row label{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
.row input[type=number]{width:4.5em;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row input[type=range]{width:9em}
.note{font-size:13px;color:var(--dim);line-height:1.6;margin:0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.undo{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--panel);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:10px 16px;font-size:15px;font-weight:700;box-shadow:0 4px 16px #0008}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>学会プロンプター</h1>
    <span id="st" class="pill">停止中</span>
    <span id="tm" class="timer">7:00</span>
    <button id="openEdit" class="icon-btn" type="button">原稿・設定</button>
  </header>

  <main id="stage" class="stage" aria-live="off">
    <div class="guide" aria-hidden="true"></div>
    <div id="script" class="script"></div>
  </main>

  <div id="heard" class="heard">聞き取った言葉がここに出ます</div>

  <nav class="ctrl">
    <button id="back" type="button" aria-label="前の文へ">‹ 前</button>
    <button id="reset" type="button" aria-label="最初に戻る">先頭</button>
    <button id="go" class="go" type="button">開始</button>
    <button id="fwd" type="button" aria-label="次の文へ">次 ›</button>
    <button id="tmr" type="button">時計</button>
  </nav>
</div>

<section id="sheet" class="sheet" hidden>
  <h2>原稿と設定</h2>
  <textarea id="src" spellcheck="false" aria-label="原稿"></textarea>
  <div class="row">
    <label>持ち時間 <input id="mins" type="number" min="1" max="60" value="7"> 分</label>
    <label>文字 <input id="fs" type="range" min="18" max="56" value="28"></label>
    <label><input id="mir" type="checkbox"> 左右反転</label>
  </div>
  <p class="note">原稿は句点（。）や改行で文に区切られます。数字や英語の読み方が認識結果と違っても、前後の文字から位置を推定します。ずれたときは、読みたい文をタップするか「前」「次」で合わせてください。原稿はこの端末のブラウザにだけ保存されます。</p>
  <div class="btns">
    <button id="clear" class="ghost" type="button">原稿を消す</button>
    <button id="done" class="primary" type="button">この原稿で使う</button>
  </div>
</section>

<button id="undo" class="undo" type="button" hidden>↩ 元の位置に戻す（「もどる」）</button>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const SAMPLE = `【サンプル原稿】本日は、乳房再建における脂肪注入の生着率向上について、当院での取り組みをご報告いたします。

対象は二〇二三年から二〇二五年に脂肪注入を行った百二十八例です。平均年齢は四十六歳、観察期間の中央値は十四か月でした。

脂肪の採取にはコールマン法を用い、遠心分離の条件を三つの群に分けて比較しました。生着率の評価には、術前と術後六か月のMRIによる体積測定を用いました。

結果として、低速の遠心分離群では生着率が平均六十八パーセントと、ほかの群に比べて有意に高い値を示しました。

以上より、採取から注入までの処理を丁寧に行うことが、生着率の向上に直結すると考えられます。ご清聴ありがとうございました。`;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('prompter:'+k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('prompter:'+k, v); } catch {} }
};

// ---------- text model ----------
let orig = '';            // original script
let normStr = '';         // normalized characters joined
let nmap = [];            // norm index -> orig index
let sents = [];           // {a,b} orig ranges [a,b)
let pos = 0;              // pointer in norm (chars read so far)

function normChar(c){
  let s = c.normalize('NFKC').toLowerCase();
  let out = '';
  for (const ch of s){
    let code = ch.codePointAt(0);
    if (code >= 0x30A1 && code <= 0x30F6) code -= 0x60;           // katakana -> hiragana
    const h = String.fromCodePoint(code);
    if (/[\p{L}\p{N}]/u.test(h) && h !== 'ー') out += h;
  }
  return out;
}
function normalize(str){ let o=''; for (const ch of str) o += normChar(ch); return o; }

function build(text){
  orig = text;
  sents = []; let a = 0;
  for (let i = 0; i < orig.length; i++){
    const c = orig[i];
    if (c === '\n'){ if (i > a) sents.push({a, b:i}); sents.push({a:i, b:i+1, br:true}); a = i+1; }
    else if ('。！？!?'.includes(c)){
      let j = i+1; while (j < orig.length && '」』）)'.includes(orig[j])) j++;
      sents.push({a, b:j}); a = j; i = j-1;
    }
  }
  if (a < orig.length) sents.push({a, b:orig.length});
  // slide cues like (クリック) on their own line: shown, not read
  const CUE = /^\s*[（(【\[][^）)】\]]*[）)】\]]\s*$/;
  for (const s of sents) if (!s.br && CUE.test(orig.slice(s.a, s.b))) s.cue = true;
  nmap = []; let ns = '';
  for (const s of sents){
    s.na = nmap.length;
    if (!s.br && !s.cue){
      for (let i = s.a; i < s.b; i++){ for (const ch of normChar(orig[i])){ ns += ch; nmap.push(i); } }
    }
    s.nb = nmap.length;
  }
  normStr = ns; buildIndex();
  pos = 0; conf = 0; lastMove = 0; pending = null; hist = []; renderAll();
}
const skip = s => s.br || s.cue;

// ---------- rendering ----------
const scriptEl = $('script');
let sentEls = [];
function esc(t){ return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderAll(){
  scriptEl.innerHTML = '';
  sentEls = sents.map((s, i) => {
    if (s.br){ const br = document.createElement('span'); br.className = 'para'; scriptEl.appendChild(br); return br; }
    const el = document.createElement('span');
    if (s.cue){ el.className = 'cue'; el.textContent = orig.slice(s.a, s.b).trim().replace(/^[（(【\[]|[）)】\]]$/g, ''); scriptEl.appendChild(el); return el; }
    el.className = 's'; el.dataset.i = i;
    el.textContent = orig.slice(s.a, s.b);
    scriptEl.appendChild(el);
    return el;
  });
  lastCur = -1; update(true);
}
let lastCur = -1;
function curIndex(){
  // sentence that contains pos (first not fully read)
  for (let i = 0; i < sents.length; i++){
    const s = sents[i]; if (skip(s)) continue;
    if (pos < s.nb) return i;
  }
  for (let i = sents.length-1; i >= 0; i--) if (!skip(sents[i])) return i;
  return -1;
}
function update(forceScroll){
  const ci = curIndex();
  sents.forEach((s, i) => {
    if (s.br) return;
    if (s.cue){ sentEls[i].className = i < ci ? 'cue past' : 'cue'; return; }
    const el = sentEls[i];
    const want = i < ci ? 's done' : i === ci ? 's cur' : 's';
    if (el.className !== want) el.className = want;
    if (i !== ci && el.dataset.split){ el.textContent = orig.slice(s.a, s.b); delete el.dataset.split; }
  });
  if (ci >= 0){
    const s = sents[ci], el = sentEls[ci];
    const cut = pos <= s.na ? s.a : pos >= s.nb ? s.b : nmap[pos-1] + 1;
    el.innerHTML = '<span class="r">' + esc(orig.slice(s.a, cut)) + '</span><span class="caret"></span>' + esc(orig.slice(cut, s.b));
    el.dataset.split = '1';
    if (forceScroll) holdUntil = 0;
    scrollTo(el);
  }
  lastCur = ci;
}
const stage = $('stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Follow the reading caret line by line with an eased glide instead of jumping by sentence.
let scrollTarget = null, holdUntil = 0;
function scrollTo(el){
  const c = el.querySelector('.caret') || el;
  scrollTarget = Math.max(0, c.offsetTop - stage.clientHeight * 0.3 + 4);
}
function glide(){
  if (scrollTarget !== null && performance.now() > holdUntil){
    const cur = stage.scrollTop, d = scrollTarget - cur;
    if (Math.abs(d) >= 1){
      const k = reduce ? 0.25 : 0.07;                       // ~0.6 s to settle one line
      const step = Math.sign(d) * Math.min(Math.max(Math.abs(d) * k, 1), 26);
      stage.scrollTop = cur + step;
    }
  }
  requestAnimationFrame(glide);
}
requestAnimationFrame(glide);
// if the speaker scrolls by hand, pause following for a moment
['touchstart', 'wheel'].forEach(t => stage.addEventListener(t, () => { holdUntil = performance.now() + 2500; }, {passive: true}));

// ---------- matching ----------
// Global alignment by bigram voting: every heard bigram votes for where the
// reading would end in the script. Works across unrecognized words and skips.
let bgIndex = new Map();
function buildIndex(){
  bgIndex = new Map();
  for (let i = 0; i < normStr.length - 1; i++){
    const g = normStr.slice(i, i+2);
    let a = bgIndex.get(g); if (!a) bgIndex.set(g, a = []); a.push(i);
  }
}
function score(q){
  const Lq = q.length, votes = new Map(); let total = 0;
  const add = (e, w) => votes.set(e, (votes.get(e) || 0) + w);
  for (let j = 0; j < Lq - 1; j++){
    const w = 0.4 + 0.6 * j / Math.max(1, Lq - 2);   // recent speech counts more
    total += w;
    const ps = bgIndex.get(q.slice(j, j+2)); if (!ps || ps.length > 80) continue;
    const d = Lq - j;                                  // chars from this bigram to the end
    const spread = 1 + Math.floor(d / 5);              // kanji/kana length drift
    for (const p of ps){
      const e = p + d;
      for (let k = -spread; k <= spread; k++) add(e + k, w * (1 - Math.abs(k) / (spread + 1)));
    }
  }
  let best = -1, bs = 0;
  for (const [e, v] of votes) if (v > bs || (v === bs && e < best)){ bs = v; best = e; }
  return {e: Math.min(Math.max(best, 0), normStr.length), s: total ? bs / total : 0};
}
let pending = null, lastMove = 0, conf = 0;       // conf = last position confirmed by speech
let hist = [], rate = 0.0065, lastHeard = 0;      // rate in chars per ms (~6.5 chars/s)
function decide(e, sc, now){
  const near = e >= conf - 40 && e <= conf + 350;
  const stalled = now - lastMove > 2000;
  let ok = false;
  if (near && e > conf && sc >= 0.2) ok = true;
  else if (near && e < conf - 6 && sc >= 0.5) ok = true;
  else if (stalled && e > conf && sc >= 0.26) ok = true;
  else if (sc >= 0.38){
    if (pending !== null && Math.abs(pending - e) < 25) ok = true;   // far jump, confirmed twice
    else pending = e;
  }
  if (!ok || e === conf) return false;
  const jumped = Math.abs(e - conf) > 60;
  if (jumped) offerUndo(conf, now);
  conf = e; lastMove = now; pending = null;
  if (jumped) hist = [];
  hist.push([now, e]); while (hist.length && now - hist[0][0] > 8000) hist.shift();
  if (hist.length >= 3){
    const [t0, p0] = hist[0], dt = now - t0;
    if (dt > 1500) rate = Math.min(0.011, Math.max(0.003, (e - p0) / dt));
  }
  // keep a small forward prediction unless speech says we went back
  if (e >= pos - 14) pos = Math.max(pos, e); else pos = e;
  return true;
}
function locate(heardNorm){
  if (heardNorm.length < 3) return;
  const now = performance.now(); lastHeard = now;
  const a = score(heardNorm.slice(-24)), b = heardNorm.length >= 8 ? score(heardNorm.slice(-12)) : {e:-1, s:0};
  // prefer the candidate that moves forward nearby
  const cand = [a, b].filter(r => r.e >= 0).sort((x, y) => {
    const nx = x.e > conf && x.e <= conf + 350, ny = y.e > conf && y.e <= conf + 350;
    return (ny - nx) || (y.s - x.s);
  });
  for (const r of cand) if (decide(r.e, r.s, now)){ update(); return; }
}
// ---------- undo a sudden jump (button or saying もどる) ----------
let undo = null, undoTimer = 0;
const undoBtn = document.getElementById('undo');
function offerUndo(prev, now){
  undo = {pos: prev, at: now, mark: lastHeardLen};
  undoBtn.hidden = false;
  clearTimeout(undoTimer); undoTimer = setTimeout(clearUndo, 10000);
}
function clearUndo(){ undo = null; undoBtn.hidden = true; clearTimeout(undoTimer); }
function restore(){
  if (!undo) return;
  pos = conf = undo.pos; ignore = lastHeardLen; pending = null; hist = [];
  lastMove = performance.now(); clearUndo(); update(true);
  toast('元の位置に戻しました');
}
undoBtn.onclick = restore;
const UNDO_WORD = /もどる|もどって|もどし|戻る|戻って|戻し/;

// between recognition updates, advance at the speaker's pace (max 14 chars ahead)
setInterval(() => {
  if (!running) return;
  const now = performance.now();
  if (now - lastHeard > 1300 || now - lastMove > 4000) return;   // silence: hold
  const target = Math.min(normStr.length, conf + Math.min(14, Math.round(rate * (now - lastMove + 800))));
  if (target > pos){ pos = target; update(); }
}, 120);

// ---------- speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, running = false, finalBuf = '', ignore = 0, lastHeardLen = 0;
const stEl = $('st'), heardEl = $('heard'), goBtn = $('go');
function status(t, cls){ stEl.textContent = t; stEl.className = 'pill' + (cls ? ' ' + cls : ''); }
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }

function makeRec(){
  const r = new SR();
  r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  r.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalBuf += t; else interim += t;
    }
    if (finalBuf.length > 400){ const cut = finalBuf.length - 200; ignore = Math.max(0, ignore - normalize(finalBuf.slice(0, cut)).length); finalBuf = finalBuf.slice(cut); }
    const shown = (finalBuf + interim).slice(-40);
    heardEl.innerHTML = '聞き取り：<b>' + esc(shown) + '</b>';
    const full = normalize(finalBuf + interim);
    if (full.length < ignore) ignore = 0;
    lastHeardLen = full.length;
    if (undo && UNDO_WORD.test(full.slice(Math.max(ignore, undo.mark)))){ restore(); return; }
    locate(full.slice(ignore));
  };
  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      stopRec(); status('マイク不可', 'err');
      toast('マイクの使用が許可されていません。ブラウザの設定でこのページのマイクを許可してください。');
    } else if (ev.error === 'network'){
      status('通信エラー', 'err'); toast('音声認識には通信が必要です。電波を確認してください。手動の「次」でも進められます。');
    }
  };
  r.onend = () => {
    if (!running) return;
    // browsers end sessions periodically; restart quietly
    setTimeout(() => { if (!running) return; try { r.start(); } catch { status('再開待ち', 'err'); goBtn.textContent = '再開'; goBtn.classList.remove('stop'); running = false; } }, 150);
  };
  return r;
}
function startRec(){
  if (!SR){ toast('このブラウザは音声認識に対応していません。iPhoneはSafari、AndroidはChromeで開いてください。手動の「次」で進めることはできます。'); return; }
  if (!rec) rec = makeRec();
  finalBuf = ''; ignore = 0; lastHeardLen = 0;
  try { rec.start(); } catch {}
  running = true; status('認識中', 'on');
  goBtn.textContent = '停止'; goBtn.classList.add('stop');
  wake(true); startTimer();
}
function stopRec(){
  running = false;
  try { rec && rec.stop(); } catch {}
  status('停止中'); goBtn.textContent = '開始'; goBtn.classList.remove('stop');
  wake(false); pauseTimer();
}
goBtn.onclick = () => running ? stopRec() : startRec();

// ---------- manual control ----------
function jumpSentence(i){
  const s = sents[i]; if (!s || skip(s)) return;
  clearUndo(); pos = conf = s.na; ignore = lastHeardLen; pending = null; hist = []; lastMove = performance.now(); update(true);
}
function stepSentence(d){
  let ci = curIndex();
  if (d < 0 && ci >= 0 && pos > sents[ci].na){ jumpSentence(ci); return; }
  let i = ci + d;
  while (i >= 0 && i < sents.length && skip(sents[i])) i += d;
  if (i < 0) i = sents.findIndex(s => !skip(s));
  if (i >= sents.length){ pos = conf = normStr.length; update(true); return; }
  jumpSentence(i);
}
$('fwd').onclick = () => stepSentence(1);
$('back').onclick = () => stepSentence(-1);
$('reset').onclick = () => { pos = conf = 0; hist = []; ignore = lastHeardLen; pending = null; resetTimer(); update(true); };
scriptEl.addEventListener('click', e => {
  const el = e.target.closest('.s'); if (el) jumpSentence(+el.dataset.i);
});

// ---------- timer ----------
let limit = +store.get('mins', 7) * 60, elapsed = 0, tStart = 0, tId = 0;
const tmEl = $('tm');
function fmt(sec){ const neg = sec < 0; sec = Math.abs(Math.round(sec)); return (neg ? '+' : '') + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function drawTimer(){
  const now = elapsed + (tStart ? (performance.now() - tStart)/1000 : 0);
  const left = limit - now;
  tmEl.textContent = fmt(left);
  tmEl.className = 'timer' + (left < 0 ? ' over' : left < 60 ? ' warn' : '');
}
function startTimer(){ if (tStart) return; tStart = performance.now(); tId = setInterval(drawTimer, 250); }
function pauseTimer(){ if (!tStart) return; elapsed += (performance.now() - tStart)/1000; tStart = 0; clearInterval(tId); drawTimer(); }
function resetTimer(){ const r = !!tStart; pauseTimer(); elapsed = 0; drawTimer(); if (r) startTimer(); }
$('tmr').onclick = () => tStart ? pauseTimer() : startTimer();

// ---------- wake lock ----------
let lock = null;
async function wake(on){
  try {
    if (on && 'wakeLock' in navigator){ lock = await navigator.wakeLock.request('screen'); }
    else if (!on && lock){ await lock.release(); lock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(true); });

// ---------- settings sheet ----------
const sheet = $('sheet'), src = $('src'), fs = $('fs'), mir = $('mir'), mins = $('mins');
function applyView(){
  scriptEl.style.setProperty('--fs', fs.value + 'px');
  stage.classList.toggle('mirror', mir.checked);
}
$('openEdit').onclick = () => { if (running) stopRec(); src.value = orig; sheet.hidden = false; };
$('done').onclick = () => {
  const t = src.value.trim() || SAMPLE;
  store.set('text', t); store.set('fs', fs.value); store.set('mir', mir.checked ? '1' : '');
  const m = Math.max(1, Math.min(60, +mins.value || 7)); store.set('mins', m); limit = m*60;
  sheet.hidden = true; applyView(); build(t); resetTimer();
};
$('clear').onclick = () => { src.value = ''; src.focus(); };
fs.oninput = applyView; mir.onchange = applyView;

// keyboard (Bluetooth remote / keyboard)
document.addEventListener('keydown', e => {
  if (!sheet.hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); stepSentence(1); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); stepSentence(-1); }
  if (e.key === ' '){ e.preventDefault(); goBtn.click(); }
});

// ---------- boot ----------
fs.value = store.get('fs', 28); mir.checked = !!store.get('mir', ''); mins.value = store.get('mins', 7);
applyView(); build(store.get('text', SAMPLE)); drawTimer();
if (!SR) status('音声認識なし', 'err');
})();
</script>
